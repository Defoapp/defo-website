<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="60%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#030108"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f298" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f298"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Core Ambient Glow -->
  <circle cx="200" cy="200" r="140" fill="url(#coreGlow)"/>

  <!-- Outer Orbit 1 (Tilted Ellipse) -->
  <ellipse cx="200" cy="200" rx="145" ry="55" fill="none" stroke="url(#ringGrad1)" stroke-width="3" transform="rotate(-30 200 200)" opacity="0.85" filter="url(#neonGlow)"/>
  
  <!-- Orbiting Node 1 -->
  <circle cx="85" cy="135" r="7" fill="#00f298" filter="url(#neonGlow)"/>
  <circle cx="85" cy="135" r="3.5" fill="#ffffff"/>

  <!-- Outer Orbit 2 (Counter Tilted Ellipse) -->
  <ellipse cx="200" cy="200" rx="145" ry="55" fill="none" stroke="url(#ringGrad2)" stroke-width="3" transform="rotate(35 200 200)" opacity="0.85" filter="url(#neonGlow)"/>
  
  <!-- Orbiting Node 2 -->
  <circle cx="315" cy="265" r="7" fill="#c084fc" filter="url(#neonGlow)"/>
  <circle cx="315" cy="265" r="3.5" fill="#ffffff"/>

  <!-- Central Gyro Sphere -->
  <circle cx="200" cy="200" r="56" fill="#0c071d" stroke="url(#ringGrad1)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- AntiGravity Quantum Core / 4-Point Star -->
  <path d="M 200 152 Q 200 200 152 200 Q 200 200 200 248 Q 200 200 248 200 Q 200 200 200 152 Z" fill="#ffffff" filter="url(#neonGlow)"/>
  <path d="M 200 168 Q 200 200 168 200 Q 200 200 200 232 Q 200 200 232 200 Q 200 200 200 168 Z" fill="#00f298"/>
  <circle cx="200" cy="200" r="8" fill="#ffffff"/>

  <!-- Micro Quantum Sparks -->
  <circle cx="200" cy="105" r="2.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="295" cy="190" r="2" fill="#00f298" opacity="0.9"/>
  <circle cx="110" cy="225" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="240" cy="300" r="2.5" fill="#38bdf8" opacity="0.8"/>
</svg>

