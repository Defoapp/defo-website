<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="claudeBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1612"/>
      <stop offset="60%" stop-color="#140b08"/>
      <stop offset="100%" stop-color="#080403"/>
    </radialGradient>
    <radialGradient id="claudeAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#c2410c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="claudeSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="warmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Warm Canvas -->
  <rect width="400" height="400" fill="url(#claudeBg)"/>

  <!-- Warm Amber/Coral Radial Glow -->
  <circle cx="200" cy="200" r="145" fill="url(#claudeAura)"/>

  <!-- Elegant Inner Halo -->
  <circle cx="200" cy="200" r="95" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Iconic Claude Sunburst / Asterisk Rays (Center at 200, 200) -->
  <g transform="translate(200, 200)" filter="url(#warmGlow)">
    <!-- Main Vertical Beam -->
    <rect x="-8.5" y="-88" width="17" height="176" rx="8.5" fill="url(#claudeSparkGrad)"/>
    <!-- Main Horizontal Beam -->
    <rect x="-88" y="-8.5" width="176" height="17" rx="8.5" fill="url(#claudeSparkGrad)"/>
    <!-- 45 Deg Diagonal Beam -->
    <rect x="-8.5" y="-82" width="17" height="164" rx="8.5" fill="url(#claudeSparkGrad)" transform="rotate(45)"/>
    <!-- -45 Deg Diagonal Beam -->
    <rect x="-8.5" y="-82" width="17" height="164" rx="8.5" fill="url(#claudeSparkGrad)" transform="rotate(-45)"/>

    <!-- Luminous Central Core Disc -->
    <circle cx="0" cy="0" r="26" fill="#fef3c7" filter="url(#warmGlow)"/>
    <circle cx="0" cy="0" r="15" fill="#f97316"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Surrounding Wisdom Particles -->
  <circle cx="95" cy="115" r="3" fill="#fdba74" opacity="0.8"/>
  <circle cx="310" cy="100" r="2.5" fill="#fcd34d" opacity="0.75"/>
  <circle cx="320" cy="285" r="3" fill="#ea580c" opacity="0.8"/>
  <circle cx="85" cy="290" r="2.5" fill="#f97316" opacity="0.75"/>
</svg>

